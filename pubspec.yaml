name: printguard2
description: RCI3D PrintGuard - AI 3D Print Defect Detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.15.5
  firebase_messaging: ^14.7.20

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.1.2

  # UI & Charts
  fl_chart: ^0.67.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # Media
  image_picker: ^1.0.7
  permission_handler: ^11.3.1

  # Utils
  uuid: ^4.3.3
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/